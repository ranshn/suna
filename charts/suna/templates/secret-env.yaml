{{- if .Values.backend.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suna.fullname" . }}-env
  labels:
    {{- include "suna.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
