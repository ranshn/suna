{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "suna.fullname" . }}-redis-config
  labels:
    {{- include "suna.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
data:
  redis.conf: |
    timeout {{ .Values.redis.config.timeout }}
{{- end }}
