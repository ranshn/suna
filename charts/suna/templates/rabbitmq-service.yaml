{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "suna.fullname" . }}-rabbitmq
  labels:
    {{- include "suna.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: amqp
      protocol: TCP
      name: amqp
    {{- if .Values.rabbitmq.management.enabled }}
    - port: 15672
      targetPort: management
      protocol: TCP
      name: management
    {{- end }}
  selector:
    {{- include "suna.rabbitmq.selectorLabels" . | nindent 4 }}
{{- end }}
